<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="blue-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Watertight Solid Obsidian Base Silhouette -->
      <path d="
        M 0,-210
        L 140,-310
        L 190,-160
        L 225,-40
        L 250,60
        L 220,240
        L 110,320
        L 0,340
        L -110,320
        L -220,240
        L -250,60
        L -225,-40
        L -190,-160
        L -140,-310
        Z
      " fill="#0b0f19" />

      <!-- Origami Facets: Ear Tufts & Crown -->
      <polygon points="-140,-310 -80,-240 0,-210" fill="#1e293b" />
      <polygon points="-140,-310 -190,-160 -80,-180" fill="#334155" />
      <polygon points="140,-310 80,-240 0,-210" fill="#334155" />
      <polygon points="140,-310 190,-160 80,-180" fill="#1e293b" />
      <polygon points="0,-210 -80,-180 0,-110 80,-180" fill="#0f172a" />

      <!-- Facial Disc & Aggressive Alert Brows (Slanted Downward) -->
      <polygon points="-80,-180 -190,-160 -155,-105 -55,-80" fill="#1e293b" />
      <polygon points="80,-180 190,-160 155,-105 55,-80" fill="#334155" />
      <polygon points="0,-110 -55,-80 0,-30 55,-80" fill="#0b0f19" />

      <!-- Symmetrical Predator Eyes (Angular Upward Cant, Electric Cyan Optics) -->
      <polygon points="-155,-105 -60,-75 -60,-45 -145,-65" fill="#0f172a" />
      <polygon points="-142,-95 -68,-70 -68,-52 -135,-60" fill="url(#cyan-glow)" />
      <polygon points="-110,-82 -96,-80 -96,-64 -110,-66" fill="#0b0f19" />

      <polygon points="155,-105 60,-75 60,-45 145,-65" fill="#0f172a" />
      <polygon points="142,-95 68,-70 68,-52 135,-60" fill="url(#cyan-glow)" />
      <polygon points="110,-82 96,-80 96,-64 110,-66" fill="#0b0f19" />

      <!-- Cheeks / Lateral Radar Reflectors -->
      <polygon points="-190,-160 -225,-40 -145,-65" fill="#334155" />
      <polygon points="-225,-40 -145,-65 -60,40 -150,50" fill="#1e293b" />
      <polygon points="190,-160 225,-40 145,-65" fill="#475569" />
      <polygon points="225,-40 145,-65 60,40 150,50" fill="#334155" />

      <!-- Beak (Geometric Prism) -->
      <polygon points="0,-30 -22,30 0,60" fill="#0284c7" />
      <polygon points="0,-30 22,30 0,60" fill="#00f5ff" />
      <polygon points="0,60 -60,40 0,95 60,40" fill="#0f172a" />

      <!-- Symmetrical Mirrored Wing Facets (Traffic Duplication Metaphor) -->
      <polygon points="-225,-40 -250,60 -150,50" fill="#0f172a" />
      <polygon points="225,-40 250,60 150,50" fill="#1e293b" />

      <polygon points="-250,60 -220,240 -130,170 -150,50" fill="#1e293b" />
      <polygon points="250,60 220,240 130,170 150,50" fill="#334155" />

      <polygon points="-150,50 -130,170 -45,150 0,95 -60,40" fill="#334155" />
      <polygon points="150,50 130,170 45,150 0,95 60,40" fill="#475569" />

      <!-- Chest Armor Plate with Dual Stream Cyan Telemetry Core -->
      <polygon points="0,95 -45,150 0,220 45,150" fill="#1e293b" />
      <polygon points="0,115 -20,150 0,195 20,150" fill="url(#cyan-glow)" />

      <!-- Lower Wing Feathers and Tail Keel -->
      <polygon points="-220,240 -110,320 -60,260 -130,170" fill="#0f172a" />
      <polygon points="220,240 110,320 60,260 130,170" fill="#1e293b" />
      <polygon points="0,220 -45,150 -60,260 0,340 60,260 45,150" fill="#0b0f19" />
      <polygon points="0,220 -30,280 0,340 30,280" fill="#1e293b" />

    </g>
  </g>
</svg>
